# Multi-turn conversation scenario

# Login flow - entry pattern triggers the sequence
[[responses]]
on = { contains = "login" }
say = "Please enter your username:"
then = [
    { on = "*", say = "Please enter your password:" },
    { on = "*", say = "Login successful! Welcome." }
]

# Code review flow
[[responses]]
on = { contains = "review" }
say = "I'll review your code. Please share it."
then = [
    { on = "*", say = "I found a few issues. Let me explain..." },
    { on = { contains = "fix" }, say = "Here's the corrected code." }
]

# Fallback for non-matching prompts
[[responses]]
on = "*"
say = "Please start by asking me to login or review code."
