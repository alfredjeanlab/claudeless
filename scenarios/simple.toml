# Simple scenario for basic response testing

[[responses]]
on = { contains = "hello" }
say = "Hello! How can I help you today?"

[[responses]]
on = { regexp = "(?i)fix.*bug" }
say = "I'll help you fix that bug."
delay_ms = 100

[[responses]]
on = "*"
say = "I understand. Let me help with that."

[default]
say = "I'm not sure how to help with that."
