# Scenario matching capture-state.sh plan mode prompt
# Produces: ExitPlanMode tool call that creates plan.md

[claude]
permission_mode = "plan"

[default]
say = "I'll create a plan for implementing user authentication."

[[default.tools]]
call = "ExitPlanMode"

[default.tools.input]
# Load plan content from the captured fixture file
plan = { "$file" = "plan.md" }

[tools]
mode = "live"

[tools.ExitPlanMode]
approve = true
