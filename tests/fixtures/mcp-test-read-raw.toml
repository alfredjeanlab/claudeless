# Scenario: MCP Read File Test (using raw tool name)
# Uses raw MCP tool name for routing

[tools]
mode = "mock"

[[responses]]
on = { contains = "read" }
say = "I'll read the file for you."

[[responses.tools]]
call = "read_file"  # Raw MCP tool name (not qualified)
input = { path = "/tmp/mcp-test/sample.txt" }
result = "file contents from mock"
