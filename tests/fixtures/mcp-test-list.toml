# Scenario: MCP List Directory Test
# Simulates listing directory via MCP filesystem tools

[tools]
mode = "mock"

[tools.mcp__filesystem__list_directory]
approve = true

[[responses]]
on = { contains = "list" }
say = "Here are the files in the directory:"

[[responses.tools]]
call = "mcp__filesystem__list_directory"
input = { path = "/tmp/mcp-test" }
result = "[FILE] sample.txt\n[FILE] test-output.txt"
