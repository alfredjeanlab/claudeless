# Scenario: MCP Read File Test
# Simulates reading a file via MCP filesystem tools

[tools]
mode = "mock"

[tools.mcp__filesystem__read_file]
approve = true

[[responses]]
on = { contains = "read" }
say = "I'll read the file for you."

[[responses.tools]]
call = "mcp__filesystem__read_file"
input = { path = "/tmp/mcp-test/sample.txt" }
result = "hello world"
