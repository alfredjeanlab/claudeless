[claude]
trusted = true
session_id = "00000000-0000-0000-0000-000000000001"
project_path = "/test/project"
launch_timestamp = "2025-01-01T00:00:00Z"
username = "TestUser"
version = "2.1.29"
provider = "Claude API"

[[responses]]
on = { contains = "list files in ~/Downloads" }
say = ""

[[responses.tools]]
call = "Read"
result = "1 file…"

[responses.tools.input]
file_path = "context"

[[responses.tools]]
call = "Bash"
result = "The user doesn't want to proceed with this tool use. The tool use was rejected (eg. if it was a file edit, the new_string was NOT written to the file). STOP what you are doing and wait for the user to tell you how to proceed."

[responses.tools.input]
command = "ls -la ~/Downloads"
description = "List files in Downloads directory"


[default]
say = "I understand. Let me help with that."

[tools]
mode = "mock"
