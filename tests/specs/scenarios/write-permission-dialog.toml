[claude]
trusted = true
session_id = "00000000-0000-0000-0000-000000000001"
project_path = "/test/project"
launch_timestamp = "2025-01-01T00:00:00Z"
username = "TestUser"
version = "2.1.29"
provider = "Claude API"

[[responses]]
on = { contains = "Create a new file called newfile.txt with the content hello" }
