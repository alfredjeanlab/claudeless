[claude]
trusted = true
session_id = "00000000-0000-0000-0000-000000000001"
project_path = "/test/project"
launch_timestamp = "2025-01-01T00:00:00Z"
username = "TestUser"
version = "2.1.29"
provider = "Claude API"

[[responses]]
on = { contains = "Create a file called test.txt with the content: Hello World" }
say = "Done! I've created test.txt with the content \"Hello World\" in your current working directory."

[[responses.tools]]
call = "Write"
result = "Wrote 1 lines to test.txt"

[responses.tools.input]
file_path = "test.txt"
content = "Hello World"


[[responses]]
on = { contains = "Edit test.txt and change Hello to Goodbye" }
say = ""

[[responses.tools]]
call = "Read"
result = "1 file"

[responses.tools.input]
file_path = "test.txt"

[[responses.then]]
on = "*"
say = ""

[[responses.then.tools]]
call = "Edit"
result = "The user doesn't want to proceed with this tool use. The tool use was rejected (eg. if it was a file edit, the new_string was NOT written to the file). STOP what you are doing and wait for the user to tell you how to proceed."

[responses.then.tools.input]
replace_all = false
file_path = "test.txt"
old_string = "Hello World"
new_string = "Goodbye World"


[default]
say = "I understand. Let me help with that."

[tools]
mode = "mock"
